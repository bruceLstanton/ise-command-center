<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ISE Command Center</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ise-theme.css') }}">
</head>
<body>
  <header><a class="brand" href="{{ url_for('portal.dashboard') }}"><span>ISE</span> Command Center</a><nav><a href="{{ url_for('portal.dashboard') }}">Overview</a><a href="{{ url_for('portal.audit_log') }}">Audit</a></nav></header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
